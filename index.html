<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبر الحقيقة — AI Reality Check</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f6;--card:#fff;--ink:#12352e;--mute:#4d6b63;--brand:#075e5e;--mint:#56c596;--teal:#329d9c;--line:#cfe3dc;--ok:#318360;--bad:#d64545;--okbg:#e3f5ec;--badbg:#fbe8e8;--hero:#085e5f;--heroink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1f1b;--card:#12302a;--ink:#e6f3ee;--mute:#9bbdb2;--brand:#56c596;--line:#24473f;--okbg:#14412f;--badbg:#4a2224;--hero:#05423f}}
:root[data-theme="dark"]{--bg:#0c1f1b;--card:#12302a;--ink:#e6f3ee;--mute:#9bbdb2;--brand:#56c596;--line:#24473f;--okbg:#14412f;--badbg:#4a2224;--hero:#05423f}
html{height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.8;font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hero);color:var(--heroink);display:flex;align-items:center;gap:12px;padding:10px 18px}
header .logo{height:46px;width:auto;flex:none;display:block}
header b{font-size:15px;line-height:1.3;flex:1}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
.lang{background:var(--mint);color:#043f3f;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--hero) 60%,#164f3c);color:var(--heroink);padding:34px 18px 54px;position:relative;overflow:hidden}.hero .deco{position:absolute;inset-inline-end:-40px;top:-20px;width:280px;opacity:.13;pointer-events:none}.hero .wrap{position:relative}
.wrap{max-width:860px;margin:0 auto}
.hero p.k{margin:0;color:var(--mint);font-weight:500}
.hero h1{margin:4px 0 12px;font-size:clamp(34px,8vw,56px);line-height:1.2}
.hero p{margin:0;max-width:60ch;opacity:.92}
nav{max-width:860px;margin:-26px auto 0;padding:0 14px;display:flex;gap:6px;position:relative;z-index:2}
nav button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
nav button[aria-selected=true]{background:var(--mint);color:#043f3f;border-color:var(--mint);font-weight:700}
main{max-width:860px;margin:0 auto;padding:22px 14px 50px}
h2{font-size:24px;margin:26px 0 10px;color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:19px}
ul.dots{list-style:none;padding:0;margin:8px 0}
ul.dots li{padding-inline-start:26px;position:relative;margin:6px 0}
ul.dots li::before{content:"";position:absolute;inset-inline-start:2px;top:.7em;width:10px;height:10px;background:var(--mint);transform:rotate(45deg);border-radius:2px}
.steps{display:grid;gap:10px;counter-reset:s}
.steps div{display:flex;gap:12px;align-items:flex-start}
.steps i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;margin-top:3px}
:root[data-theme="dark"] .steps i,:root:not([data-theme="light"]) .steps i{color:#043f3f}
.go{display:inline-block;margin-top:8px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#043f3f}}
.learn{background:var(--hero);color:#fff;border-radius:18px;padding:18px 20px;margin-top:26px}
.learn b{color:var(--mint)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar span{display:block;height:100%;background:var(--mint);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.stage{font-size:22px;line-height:1.6;font-weight:500;min-height:100px;padding:6px 0}
.pic{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:var(--okbg);margin-bottom:10px}
.cap{font-size:17px;color:var(--mute)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick button{border:0;border-radius:14px;padding:16px 8px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;color:#fff}
.g{background:var(--ok)}.r{background:var(--bad)}
.pick button:disabled{opacity:.45;cursor:default}
.res{border-radius:14px;padding:14px 16px;margin-top:14px;font-size:16px}
.res.ok{background:var(--okbg);border:2px solid var(--ok)}
.res.no{background:var(--badbg);border:2px solid var(--bad)}
.res p{margin:4px 0}
.src{color:var(--mute);font-size:14px}
.score{font-size:64px;font-weight:700;color:var(--brand);line-height:1.1;margin:6px 0}
label{display:block;margin:14px 0 6px}
input#nm{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rk{color:var(--brand);font-weight:700;min-width:26px}
.row.me{background:var(--okbg);border-radius:10px;padding-inline:10px;font-weight:700}
.go{margin-inline-end:8px}
.go.go2{background:transparent!important;color:var(--brand)!important;border:2px solid var(--brand)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const tabIds=['home','hallucination','deepfake'];
let lang='ar';try{lang=localStorage.getItem('lang')||'ar'}catch(e){}
let tab=(location.hash||'#home').slice(1);if(!tabIds.includes(tab))tab='home';
const fresh=()=>({i:0,sc:0,done:false,started:false,draft:'',name:'',saved:false});
const st={H:fresh(),D:fresh()};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEM={};
function lbGet(k){try{const v=localStorage.getItem('lb_'+k);if(v)return JSON.parse(v)}catch(e){}return (MEM[k]||[]).slice()}
function lbSet(k,l){MEM[k]=l;try{localStorage.setItem('lb_'+k,JSON.stringify(l))}catch(e){}}
const $=id=>document.getElementById(id);
const li=a=>'<ul class="dots">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
function go(t){tab=t;try{location.hash=t}catch(e){}render()}
function intro(k){const t=T[lang],s=st[k];
 return `<div class="card"><h3 style="font-size:26px">${t.readyT}</h3><p>${t.nameP}</p><p>${k==='H'?t.howH:t.howD}</p><label for="nm"><b>${t.nameL}</b></label><input id="nm" maxlength="24" autocomplete="off" placeholder="${t.nameH}" value="${esc(s.draft)}"><p class="src">${t.nameN}</p><button class="go" data-a="begin" data-k="${k}">${t.start}</button></div>`}
function result(k){const t=T[lang],s=st[k],n=t[k].length,nm=esc(s.name||t.guest);
 if(!s.saved){const l=lbGet(k);s.eid=Date.now()+'-'+Math.random().toString(36).slice(2,7);l.push({id:s.eid,n:s.name||t.guest,s:s.sc});lbSet(k,l);s.saved=true}
 const top=lbGet(k).map((x,o)=>({...x,o})).sort((a,b)=>b.s-a.s||a.o-b.o);
 const rank=top.findIndex(x=>x.id===s.eid)+1;
 const rows=top.slice(0,10).map((x,i)=>`<div class="row${x.id===s.eid?' me':''}"><span class="rk">${String(i+1).padStart(2,'0')}</span><span class="nm">${esc(x.n)}</span><b dir="ltr">${x.s} / ${n}</b></div>`).join('');
 const me=rank>10?`<div class="row me"><span class="rk">${rank}</span><span class="nm">${nm}</span><b dir="ltr">${s.sc} / ${n}</b></div>`:'';
 return `<div class="card"><h3 style="font-size:26px;margin:0">${t.done} ${nm}</h3><p style="margin:6px 0 0">${t.doneS}</p></div>
 <div class="card"><div>${t.yourScore}</div><div class="score" dir="ltr">${s.sc} / ${n}</div><div>${t.correctN}</div><div class="row" style="margin-top:12px"><span class="nm">${t.rankL}</span><b dir="ltr">#${rank}</b></div></div>
 <div class="card"><div class="meta"><h3 style="margin:0">${t.lbT}</h3><span>${t.top10}</span></div>${rows}${me}<p class="src">${t.saveN}</p></div>
 <button class="go" data-a="home" data-k="${k}">${t.home}</button><button class="go go2" data-a="reset" data-k="${k}">${t.playAgain}</button>`}
function begin(k){const s=st[k];s.name=(s.draft||'').trim();s.started=true;render()}
function chall(k){
 const t=T[lang],s=st[k],list=t[k],n=list.length;
 if(!s.started)return intro(k);if(s.i>=n)return result(k);
 const q=list[s.i],pr=k==='H'?t.h1sub:t.h2sub,yes=k==='H'?t.ok:t.real,no=k==='H'?t.hal:t.fake;
 let h=`<p>${pr}</p><div class="card"><div class="meta"><span>${t.q} ${s.i+1} ${t.of} ${n}</span><span>${t.score}: ${s.sc}</span></div><div class="bar"><span style="width:${s.i/n*100}%"></span></div>`;
 if(k==='D')h+=`<img class="pic" src="${IM[q.i]}" alt="">`;else h+=`<div class="stage">${q.s}</div>`;
 h+=`<div class="pick"><button class="g" data-a="pick" data-k="${k}" data-v="1" ${s.done?'disabled':''}>GREEN · ${yes}</button><button class="r" data-a="pick" data-k="${k}" data-v="0" ${s.done?'disabled':''}>RED · ${no}</button></div>`;
 if(s.done){const ok=s.last===q.a;
  h+=`<div class="res ${ok?'ok':'no'}" role="status"><p><b>${ok?t.right:t.wrong}</b></p>${k==='H'?`<p><b>${t.ai}:</b> ${q.ai}</p>`:''}<p><b>${t.truth}:</b> ${q.t}</p><p class="src">${t.srcL}: ${q.src}</p></div><button class="go" data-a="next" data-k="${k}">${s.i===n-1?t.finish:t.next}</button>`}
 return h+'</div>'}
function render(){
 const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title=t.title+' — AI Reality Check';
 
 $('lang').textContent=t.other;$('lang').setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');
 $('kick').textContent=t.kick;$('kick').dir='ltr';$('kick').style.textAlign=lang==='ar'?'right':'left';$('title').innerHTML=lang==='ar'?'اختبر الحقيقة <span dir="ltr">— AI REALITY CHECK</span>':'AI REALITY CHECK';$('lead').textContent=t.lead;
 $('nav').innerHTML=tabIds.map((id,i)=>`<button role="tab" aria-selected="${id===tab}" data-a="tab" data-v="${id}">${t.tabs[i]}</button>`).join('');
 let v='';
 if(tab==='home')v=`<h2>${t.pickT}</h2>
 <div class="card"><h3>${t.c1}</h3><p>${t.d1}</p><button class="go" data-a="tab" data-v="hallucination">${t.start}</button></div>
 <div class="card"><h3>${t.c2}</h3><p>${t.d2}</p><button class="go" data-a="tab" data-v="deepfake">${t.start}</button></div>
 <div class="learn"><b>${t.learnT}</b> ${t.learn}</div>`;
 else if(tab==='hallucination')v=`<h2>${t.c1}</h2>`+chall('H');
 else if(tab==='deepfake')v=`<h2>${t.c2}</h2>`+chall('D');;
 $('view').innerHTML=v}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
 if(a==='tab'){go(b.dataset.v);window.scrollTo({top:0})}
 else if(a==='pick'){const s=st[k];if(s.done)return;s.last=b.dataset.v==='1';const q=T[lang][k][s.i];if(s.last===q.a)s.sc++;s.done=true;render()}
 else if(a==='next'){st[k].i++;st[k].done=false;render()}
 else if(a==='reset'){st[k]=fresh();render()}
 else if(a==='begin')begin(k)
 else if(a==='home'){st[k]=fresh();go('home');window.scrollTo({top:0})}});
document.addEventListener('input',e=>{if(e.target.id==='nm')st[tab==='deepfake'?'D':'H'].draft=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='nm'&&e.key==='Enter')begin(tab==='deepfake'?'D':'H')});
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch(e){}render()};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(tabIds.includes(h)&&h!==tab){tab=h;render()}});
render();
</script>
